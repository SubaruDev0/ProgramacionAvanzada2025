<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Dental - Pedir Turno</title>
    <!-- Fuente Cascadia Code PL -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code+PL:wght@400;700&display=swap" rel="stylesheet">
    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/pedirTurno.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Clínica Dental Logo">
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="equipo.html">Equipo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="formulario">
            <h2>Pedir Turno</h2>
            <form class="simple-form" id="turnoForm">
                <input type="text" placeholder="Nombre completo" required>
                <input type="text" id="rut" placeholder="RUT (ej: 21.545.756-7)" required>
                <input type="tel" placeholder="Teléfono" required>
                <select required>
                    <option value="" disabled selected>Selecciona un servicio</option>
                    <option>Odontología general</option>
                    <option>Ortodoncia</option>
                    <option>Implantes dentales</option>
                    <option>Endodoncia</option>
                    <option>Periodoncia</option>
                    <option>Rehabilitación oral</option>
                    <option>Estética dental</option>
                    <option>Prótesis dentales</option>
                    <option>Cirugía oral</option>
                    <option>Odontopediatría</option>
                    <option>Urgencias dentales</option>
                    <option>Limpieza dental</option>
                    <option>Radiografías y diagnóstico</option>
                </select>
                <button type="submit">Enviar Solicitud</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Clínica Dental. Todos los derechos reservados.</p>
        <div class="redes-sociales">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

    <script src="js/restricciones.js"></script>
</body>
</html>
