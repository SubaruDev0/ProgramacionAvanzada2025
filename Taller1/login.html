<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica Dental</title>

    <!-- =====================
         Google Fonts
         Se carga la fuente Cascadia Code PL para títulos y textos
    ===================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code+PL:wght@400;700&display=swap" rel="stylesheet">

    <!-- =====================
         Hoja de estilos CSS externa
         Contiene todos los estilos del login
    ===================== -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- =====================
         BANNER DE FONDO FULL-SCREEN
         Imagen de fondo y overlay azul semitransparente
    ===================== -->
    <section class="banner">
        <!-- Imagen principal del banner -->
        <img src="img/banner.png" alt="Banner Clínica">

        <!-- Overlay azul semitransparente encima del banner
             Permite que el formulario destaque sobre la imagen -->
        <div class="overlay"></div>
    </section>

    <!-- =====================
         FORMULARIO CENTRAL DE LOGIN
         Contenedor centrado con fondo blanco y sombra
    ===================== -->
    <div class="login-container">
        <!-- Título del formulario -->
        <h1>Clínica Dental</h1>

        <!-- Formulario de login -->
        <form id="loginForm">
            <!-- Campo de usuario -->
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
            </div>

            <!-- Campo de contraseña -->
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>

            <!-- Botón de enviar formulario -->
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
