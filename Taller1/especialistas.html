<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Especialistas – Clínica Dental</title>

  <!-- Usa la misma ruta de tu proyecto -->
  <link rel="stylesheet" href="./styles.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- =========================================================
       ENCABEZADO (TÍTULO + VOLVER)
       ========================================================= -->
  <header class="header header-rounded">
    <nav class="nav nav--simple">
      <div class="title">Clínica Dental</div>
      <a class="cta-dark" href="index.html">Volver</a>
    </nav>
  </header>

  <!-- =========================================================
       CONTENIDO
       ========================================================= -->
  <main class="section">
    <h1 style="text-align:center;margin:0 0 22px">Nuestros especialistas</h1>
    <p style="text-align:center;color:var(--muted);margin:-6px 0 28px">
      Conoce a nuestro equipo profesional.
    </p>

    <!-- ===== Grid centrado con 2 especialistas ===== -->
    <section class="experts">
      <div class="experts-grid">

        <!-- =========================================================
             ESPECIALISTA 1: ORTODONCISTA
             ========================================================= -->
        <article class="expert-card">
          <div class="photo">
            <!-- Ruta ppara la imagen -->
            <img src="Imagen/Especialista/ortodoncista.jpg" alt="Ortodoncia - Especialista">
          </div>
          <h3>Elen Diaz</h3>
          <p class="area">ORTODONCISTA</p>
          <p class="bio">Especialista en alineación dental y corrección de mordida.</p>
        </article>

        <!-- =========================================================
             ESPECIALISTA 2: HIGIENISTA DENTAL
             ========================================================= -->
        <article class="expert-card">
          <div class="photo">
            <!-- Ruta ppara la imagen -->
            <img src="Imagen/Especialista/Higiene dental.webp" alt="Higiene dental - Especialista">
          </div>
          <h3>Javiera Perez</h3>
          <p class="area">HIGIENISTA DENTAL</p>
          <p class="bio">Cuidado preventivo, profilaxis y educación en salud oral.</p>
        </article>

      </div>
    </section>
  </main>

  <!-- =========================================================
       PIE
       ========================================================= -->
  <footer>
    <div class="wrap">© 2025 Clínica Dental</div>
  </footer>

</body>
</html>
