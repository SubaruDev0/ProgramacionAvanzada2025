<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Cita - Clínica Dental Sonrisa Familiar</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    .mensaje {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #007acc;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-weight: 500;
      display: none;
      z-index: 1000;
    }

    .mensaje.error {
      background-color: #e74c3c;
    }

    .mensaje.exito {
      background-color: #2ecc71;
    }
  </style>
</head>
<body>
  <header>Agendar Cita - Clínica Dental Sonrisa Familiar</header>

  <main>
    <h2 style="text-align:center; margin-top:20px; color:#007acc;">Reserva tu Cita</h2>
    <p style="text-align:center; color:#444; margin-bottom:30px;">
      Elige el día, hora y tratamiento para tu próxima cita con nosotros.
    </p>

    <section class="form-section">
      <form class="form" id="formCita">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="Ej: juan@email.com" required>

        <label for="tratamiento">Tratamiento:</label>
        <select id="tratamiento" name="tratamiento" required>
          <option value="">Seleccione un tratamiento</option>
          <option value="consulta">Consulta General - $15.000 CLP</option>
          <option value="limpieza">Limpieza Dental - $25.000 CLP</option>
          <option value="caries">Obturación de Caries - $30.000 CLP</option>
          <option value="endodoncia">Endodoncia - $60.000 CLP</option>
          <option value="extraccion">Extracción Dental - $35.000 CLP</option>
        </select>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="hora">Hora:</label>
        <select id="hora" name="hora" required>
          <option value="">Seleccione una hora</option>
          <option>14:30</option>
          <option>15:00</option>
          <option>15:30</option>
          <option>16:00</option>
          <option>16:30</option>
          <option>17:00</option>
          <option>17:30</option>
          <option>18:00</option>
          <option>18:30</option>
          <option>19:00</option>
        </select>

        <button type="submit" class="btn">Confirmar Cita</button>
      </form>
    </section>

    <div style="text-align:center; margin-top: 40px;">
      <a href="menu.html" class="btn">Volver al Menú</a>
    </div>
  </main>

  <div id="mensaje" class="mensaje"></div>

  <script>
    const fechaInput = document.getElementById('fecha');
    const mensajeDiv = document.getElementById('mensaje');
    const form = document.getElementById('formCita');

    (function setMinDate() {
      const hoy = new Date();
      const yyyy = hoy.getFullYear();
      const mm = String(hoy.getMonth() + 1).padStart(2, '0');
      const dd = String(hoy.getDate()).padStart(2, '0');
      const fechaMinima = `${yyyy}-${mm}-${dd}`;
      fechaInput.setAttribute('min', fechaMinima);
    })();

    function mostrarMensaje(texto, tipo = "exito") {
      mensajeDiv.textContent = texto;
      mensajeDiv.className = `mensaje ${tipo}`;
      mensajeDiv.style.display = "block";
      clearTimeout(mostrarMensaje._timeout);
      mostrarMensaje._timeout = setTimeout(() => {
        mensajeDiv.style.display = "none";
      }, 3000);
    }

    function fechaStringALocalDate(fechaStr) {
      const parts = fechaStr.split('-').map(Number);
      if (parts.length !== 3) return null;
      const [y, m, d] = parts;
      return new Date(y, m - 1, d);
    }

    fechaInput.addEventListener('input', () => {
      const val = fechaInput.value;
      if (!val) return;
      const fechaSeleccionada = fechaStringALocalDate(val);
      if (!fechaSeleccionada) return;
      const diaSemana = fechaSeleccionada.getDay(); // 0 = Domingo
      if (diaSemana === 0) {
        mostrarMensaje("🚫 No se pueden agendar citas los domingos.", "error");
        fechaInput.value = "";
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!fechaInput.value) {
        mostrarMensaje("⚠️ Por favor selecciona una fecha válida.", "error");
        return;
      }
      const fechaSeleccionada = fechaStringALocalDate(fechaInput.value);
      if (!fechaSeleccionada) {
        mostrarMensaje("⚠️ Fecha inválida.", "error");
        return;
      }
      if (fechaSeleccionada.getDay() === 0) {
        mostrarMensaje("🚫 No se pueden agendar citas los domingos.", "error");
        return;
      }

      mostrarMensaje("✅ Cita agendada con éxito.", "exito");

      setTimeout(() => {
        form.reset();
      }, 1500);
    });
  </script>
</body>
</html>
