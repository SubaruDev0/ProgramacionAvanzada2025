<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Cita - Clínica Dental</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    /* Estilos del mensaje emergente */
    .mensaje-exito {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #4db8ff;
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      font-size: 16px;
      display: none;
      z-index: 1000;
      animation: aparecer 0.3s ease-out;
    }

    @keyframes aparecer {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <header><h1>Agendar Cita</h1></header>
  <main>
    <form id="citaForm" class="formulario">
      <label>Paciente:</label>
      <input type="text" placeholder="Nombre completo" required>

      <label>Dentista:</label>
      <select id="dentista" required>
        <option value="" disabled selected>-- Elige un dentista --</option>
        <option value="lopez">Dra. López (Ortodoncia)</option>
        <option value="perez">Dr. Pérez (Endodoncia)</option>
      </select>

      <label>Tratamiento:</label>
      <select id="tratamiento" required>
        <option value="" disabled selected>-- Elige un tratamiento --</option>
        <option value="consulta" data-precio="20000">Consultas</option>
        <option value="limpieza" data-precio="25000">Limpieza Dental</option>
        <option value="caries" data-precio="30000">Obstrucción de Caries</option>
        <option value="endodoncia" data-precio="50000">Endodoncias</option>
        <option value="extraccion" data-precio="40000">Extracciones Dentales</option>
      </select>

      <label>Precio (CLP):</label>
      <input type="text" id="precio" readonly>

      <label>Fecha:</label>
      <input type="date" id="fecha" required>

      <label>Hora:</label>
      <select id="hora" required disabled>
        <option value="" disabled selected>-- Selecciona una fecha primero --</option>
      </select>

      <button type="submit">Guardar Cita</button>
    </form>

    <a href="menu.html" class="btn">Volver al menú</a>
  </main>

  <!-- Contenedor del mensaje -->
  <div id="mensajeExito" class="mensaje-exito"></div>

  <script>
    // Vincular precio según tratamiento seleccionado
    const selectTratamiento = document.getElementById('tratamiento');
    const precioInput = document.getElementById('precio');
    selectTratamiento.addEventListener('change', () => {
      const selected = selectTratamiento.options[selectTratamiento.selectedIndex];
      const precio = selected.getAttribute('data-precio');
      precioInput.value = `$${Number(precio).toLocaleString('es-CL')}`;
    });

    // Bloquear fechas pasadas
    const inputFecha = document.getElementById('fecha');
    const hoy = new Date();
    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const dd = String(hoy.getDate()).padStart(2, '0');
    const fechaMin = `${yyyy}-${mm}-${dd}`;
    inputFecha.min = fechaMin;

    // Generar horarios dinámicamente
    const selectHora = document.getElementById('hora');
    inputFecha.addEventListener('change', () => {
      const fechaSeleccionada = new Date(inputFecha.value);
      const diaSemana = fechaSeleccionada.getUTCDay(); // 0 = Domingo

      if (diaSemana === 0) {
        mostrarMensaje("🚫 La clínica no atiende los domingos. Elige otro día.", true);
        inputFecha.value = "";
        selectHora.innerHTML = "<option value='' disabled selected>-- Selecciona una fecha válida --</option>";
        selectHora.disabled = true;
        return;
      }

      // Si no es domingo, generar horarios
      selectHora.innerHTML = "";
      const horarios = generarHorarios("14:30", "19:00", 30);
      horarios.forEach(h => {
        const option = document.createElement('option');
        option.value = h;
        option.textContent = h;
        selectHora.appendChild(option);
      });
      selectHora.disabled = false;
    });

    function generarHorarios(inicio, fin, intervaloMin) {
      const result = [];
      let [hora, min] = inicio.split(":").map(Number);
      const [horaFin, minFin] = fin.split(":").map(Number);

      while (hora < horaFin || (hora === horaFin && min <= minFin)) {
        const hh = hora.toString().padStart(2, "0");
        const mm = min.toString().padStart(2, "0");
        result.push(`${hh}:${mm}`);
        min += intervaloMin;
        if (min >= 60) {
          hora++;
          min -= 60;
        }
      }
      return result;
    }

    // Mostrar mensaje en pantalla
    const mensaje = document.getElementById("mensajeExito");
    function mostrarMensaje(texto, error = false) {
      mensaje.textContent = texto;
      mensaje.style.backgroundColor = error ? "#ff6b6b" : "#4db8ff";
      mensaje.style.display = "block";
      setTimeout(() => mensaje.style.display = "none", 3000);
    }

    // Simulación de guardado de cita
    document.getElementById('citaForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fecha = inputFecha.value;
      const hora = selectHora.value;
      if (!fecha || !hora) {
        mostrarMensaje("⚠️ Por favor selecciona una fecha y hora válida.", true);
        return;
      }
      mostrarMensaje(`✅ Cita agendada correctamente el ${fecha} a las ${hora}.`);
      e.target.reset();
      selectHora.innerHTML = "<option value='' disabled selected>-- Selecciona una fecha primero --</option>";
      selectHora.disabled = true;
      precioInput.value = "";
    });
  </script>
</body>
</html>
