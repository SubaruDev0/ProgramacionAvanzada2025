<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Clínica Dental Sonrisa Familiar</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    /* Mensaje de envío */
    .mensaje-exito {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #4db8ff;
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      font-size: 16px;
      display: none;
      z-index: 1000;
      animation: aparecer 0.3s ease-out;
    }

    @keyframes aparecer {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <header>Clínica Dental Sonrisa Familiar</header>

  <main>
    <h2 style="text-align:center; margin-top:20px; color:#007acc;">Contáctanos</h2>
    <p style="text-align:center; color:#444; margin-bottom:30px;">
      Envía tus consultas y nos pondremos en contacto contigo lo antes posible.
    </p>

    <form class="formulario" id="contactoForm">
      <label>Nombre completo:</label>
      <input type="text" id="nombre" required placeholder="Tu nombre completo">

      <label>Correo electrónico:</label>
      <input type="email" id="correo" required placeholder="tuemail@ejemplo.com">

      <label>Teléfono:</label>
      <input type="tel" id="telefono" required placeholder="+56 9 1234 5678">

      <label>Consulta / Mensaje:</label>
      <textarea id="mensaje" rows="5" required placeholder="Escribe tu consulta aquí..."></textarea>

      <button type="submit">Enviar Consulta</button>
    </form>

    <div style="text-align:center; margin-top: 30px;">
      <a href="menu.html" class="btn">⬅ Volver al Menú Principal</a>
    </div>
  </main>

  <!-- Contenedor del mensaje -->
  <div id="mensajeExito" class="mensaje-exito"></div>

  <script>
    const form = document.getElementById("contactoForm");
    const mensaje = document.getElementById("mensajeExito");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      // Mostrar mensaje de éxito
      mensaje.textContent = "✅ Tu consulta ha sido enviada correctamente. ¡Gracias!";
      mensaje.style.display = "block";

      // Ocultar mensaje después de 3 segundos
      setTimeout(() => mensaje.style.display = "none", 3000);

      // Reiniciar formulario
      form.reset();
    });
  </script>
</body>
</html>
